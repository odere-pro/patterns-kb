name: docs-sweep

# The truth sweep's schedule (spec: kb.harness.truth-sweep, schedule). It sweeps nothing: the
# runner has no model, reads no page and prints no finding. Its one step calls a session to the
# docs-sweep skill (.claude/skills/docs-sweep/SKILL.md) through an issue; the session records
# its trace on that issue and closes it. An issue already open for the sweep gets a comment
# instead of a twin.
on:
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  issues: write

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call a session to the docs-sweep skill
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Docs sweep is due"
          body="Run the docs-sweep skill (.claude/skills/docs-sweep/SKILL.md) in a session on this repository. Comment its trace here — pages covered, findings kept and dropped, the branch and the grouped issue — then close this issue."
          open="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Still due. $body"
          else
            gh issue create --title "$title" --body "$body"
          fi
